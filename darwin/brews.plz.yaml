cmds:
  apply:
    desc: Downloads and installs brews listed in the Brewfile.
    platform: MacOS
    actions:
      - echo "Applying brews"
      - brew bundle --file ./Brewfile
      - ./post-brew.sh
      # `cleanup` uninstalls anything not in ./Brewfile, so apply-work must
      # run after it - otherwise work-only brews would be removed again
      # immediately by the same cleanup pass.
      - plz brews cleanup
      - sh: '[ "$DOTFILES_PROFILE" = "work" ] && plz brews apply-work || true'

  apply-work:
    desc: Downloads and installs brews specifically used for work.
    platform: MacOS
    actions:
      - echo "Applying brews"
      - brew bundle --file ./Brewfile.work.rb

  cleanup:
    desc: Uninstall brews not listed in the Brewfile.
    platform: MacOS
    actions:
      - echo "Cleaning up brews"
      - brew bundle cleanup --file ./Brewfile --force

  dump:
    desc: Write all installed casks/formulae/images/taps into the Brewfile.
    platform: MacOS
    actions:
      - echo "Dumping brews"
      - brew bundle dump --file ./Brewfile --force
